spring.application.name=portfolio-api
server.port=${PORT:8080}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
contact.sender=${CONTACT_SENDER:}
contact.recipient=${CONTACT_RECIPIENT:jgfestudios@gmail.com}
contact.trust-proxy=${CONTACT_TRUST_PROXY:false}
server.error.include-message=never
server.error.include-stacktrace=never
